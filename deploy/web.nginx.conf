# Serves the built frontend and passes the API through, so the browser talks to one address.
# `resolver` + a variable: nginx looks the API up on every request, so an API restart does not break it.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    set $api http://api:8080;

    location /api/      { proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 60s; }
    location /internal/ { proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 60s; }
    location = /health  { proxy_pass $api; }
    location /          { try_files $uri /index.html; }
}
